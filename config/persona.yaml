  activities_per_day: 6
  activities:
    - { slot: morning, activity: breakfast, locations: [apartment, kololo-cafe] }
    - { slot: morning, activity: morning walk, locations: [ntinda-street] }
    - { slot: morning, activity: sunrise run, locations: [kololo-track], weight: 1.5 }
    - { slot: morning, activity: commute, locations: [ntinda-street], postable: false }
    - { slot: late_morning, activity: shop shift and restock day, locations: [pioneer-mall], weekdays_only: true, weight: 1.2 }
    - { slot: late_morning, activity: sneaker cleaning session, locations: [apartment] }
    - { slot: lunch, activity: lunch, locations: [ntinda-street, kololo-cafe] }
    - { slot: afternoon, activity: reading, locations: [bookshop, kololo-cafe] }
    - { slot: afternoon, activity: coffee break, locations: [kololo-cafe] }
    - { slot: afternoon, activity: fit check before heading out, locations: [apartment, ntinda-street], weight: 1.5 }
    - { slot: evening, activity: gym, locations: [gym] }
    - { slot: evening, activity: evening run, locations: [kololo-track] }
    - { slot: evening, activity: meeting friends, locations: [rooftop, skyz-lounge] }
    - { slot: afternoon, activity: sundowner at the hotel lounge, locations: [skyz-lounge], weight: 1.2 }
    - { slot: night, activity: reflection with a book and music, locations: [apartment] }
    - { slot: night, activity: rotation planning for the week, locations: [apartment] }
    # Weekends
    - { slot: morning, activity: Sunday church service, locations: [ntinda-street], days: [sunday], weight: 1.4 }
    - { slot: late_morning, activity: Saturday market run for fresh fruit and finds, locations: [ntinda-street], days: [saturday], weight: 1.3 }
    - { slot: lunch, activity: weekend brunch with friends, locations: [kololo-cafe, skyz-lounge], weekends_only: true, weight: 1.4 }
    - { slot: afternoon, activity: Sunday reset and sneaker cleaning, locations: [apartment], days: [sunday] }
    - { slot: afternoon, activity: slow weekend walk and coffee, locations: [kololo-cafe, ntinda-street], weekends_only: true }
    - { slot: evening, activity: football watch party with friends, locations: [rooftop, skyz-lounge], weekends_only: true }

carousel:
  structures:
    - educational
    - opinion
    - storytelling
    - lifestyle_diary
    - listicle
    - sneaker_commentary
    - reflection
    - behind_the_scenes
  min_slides: 4
  max_slides: 6
  # Plain photos, like posting straight from the camera roll. No text, handle or counters on images.
  text_overlays: false
  brand_colors:
    primary: "#FF5A1F"
    text: "#FFFFFF"
    shadow: "#000000"

weekend_ideas:
  - "weekend fit dump: 3-4 looks from the week, each a remix of pieces she already owns"
  - one piece, three ways (the same top styled with three different bottoms)
  - Sunday best, then straight into clean sneakers after church
  - Saturday market run, one candid photo and one small find
  - brunch with friends, a single candid frame, no posing
  - "Sunday reset: cleaning the week's pairs, calm and satisfying"

trends:
  region: UG
  language: en
  max_items: 8
  # Only these: Ugandan TikTok, Kampala Instagram, X in Uganda, the Premier
  # League and Champions League, and a few international culture sources.
  # (X has no free trends API for Uganda, so "X Uganda" follows Ugandan news
  # coverage of what's trending on X.)
  queries:
    - { query: "TikTok Uganda when:7d", label: TikTok Uganda }
    - { query: "Ugandan TikTokers when:7d", label: TikTok Uganda }
    - { query: "TikTok trend Uganda when:7d", label: TikTok Uganda }
    - { query: "Kampala socialite when:7d", label: Instagram Kampala }
    - { query: "Ugandan influencer when:7d", label: Instagram Kampala }
    - { query: "Kampala Instagram when:14d", label: Instagram Kampala }
    - { query: "Ugandans on X when:7d", label: X Uganda }
    - { query: "trending on X Uganda when:7d", label: X Uganda }
    - { query: "Premier League", label: Premier League }
    - { query: "Champions League", label: Champions League }
  feeds:
    - { url: "https://feeds.bbci.co.uk/sport/football/premier-league/rss.xml", label: Premier League }
    - { url: "https://feeds.bbci.co.uk/sport/football/champions-league/rss.xml", label: Champions League }
    - { url: "https://hypebeast.com/footwear/feed", label: International }
    - { url: "https://sneakernews.com/feed/", label: International }
    - { url: "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml", label: International }
  avoid: [betting]

hashtags:
  always: []
  pool: ["#sneakers", "#kampala", "#streetstyle", "#sneakerhead", "#ugandanfashion", "#rotation", "#fitcheck", "#runkampala"]
  max: 4
